<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schumacher Automotive DMS</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="sidebar">
    <h2>Schumacher Automotive</h2>
    <ul>
        <li onclick="openDashboard()">Dashboard</li>
        <li onclick="openCustomers()">Customers</li>
        <li onclick="openJobs()">Jobs</li>
        <li onclick="openCalendar()">Calendar</li>
        <li>Technicians</li>
    </ul>
</div>

<div class="main">

<!-- DASHBOARD SECTION -->
<div id="dashboardSection">
    <h1>Dashboard</h1>

    <div class="cards">
        <div class="card" onclick="openCalendar()">
            <h3>Bookings Today</h3>
            <p id="bookingCount">0</p>
        </div>
        <div class="card">
            <h3>Vehicles in Workshop</h3>
            <p>0</p>
        </div>
        <div class="card">
            <h3>Hours Booked Today</h3>
            <p>0</p>
        </div>
    </div>
</div>

<!-- CUSTOMERS SECTION -->
<div id="customersSection" style="display:none;">
    <h1>Customers</h1>

    <div style="margin-bottom:20px;">
        <button class="primary" onclick="addCustomer()">+ Add Customer</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Phone</th>
                <th>Email</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="customerTableBody"></tbody>
    </table>
</div>

<!-- JOB TYPES SECTION -->
<div id="jobsSection" style="display:none;">
    <h1>Job Types</h1>

    <div style="margin-bottom:20px;">
        <button class="primary" onclick="addJobType()">+ Add Job Type</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Service Name</th>
                <th>Description</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="jobTypesTableBody"></tbody>
    </table>
</div>
<!-- CALENDAR SECTION -->
<div id="calendarWrapper" class="calendar-wrapper">

    <div class="day-header">
        <h2>
            Bookings -
            <button onclick="changeYear(-1)">&lt;&lt;</button>
            <span id="yearDisplay"></span>
            <button onclick="changeYear(1)">&gt;&gt;</button>
        </h2>
        <button class="danger" onclick="closeCalendar()">✕ Close</button>
    </div>

    <div id="calendarGrid" class="month-grid"></div>
    <div id="monthView"></div>

    <div id="dayPanel" class="day-panel">

        <div class="day-header">
            <h2>
    <button onclick="changeDay(-1)">&lt;&lt;</button>
    <span id="dayTitle"></span>
    <button onclick="changeDay(1)">&gt;&gt;</button>
    <span id="slotCounter" class="slots"></span>
</h2>
            <button onclick="backToMonth()">← Back</button>
        </div>

        <button class="primary" onclick="addVehicle()">+ Add Vehicle</button>

        <table>
            <thead>
                <tr>
                    <th>Rego</th>
                    <th>Customer</th>
                    <th>Job Type</th>
                    <th>Status</th>
                    <th>Notes</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="jobTableBody"></tbody>
        </table>

    </div>

</div>

</div>


<script src="app.js"></script>
</body>
</html>
