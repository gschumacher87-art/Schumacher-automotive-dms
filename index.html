<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schumacher Automotive DMS</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f0f2f5;
}

.sidebar{
position:fixed;
width:240px;
height:100%;
background:#111827;
color:white;
padding:20px;
}

.sidebar h2{
margin-bottom:30px;
}

.sidebar button{
display:block;
width:100%;
padding:12px;
margin-bottom:5px;
border:none;
background:none;
color:white;
text-align:left;
font-size:16px;
}

.sidebar button:hover{
background:#1f2937;
}

.main{
margin-left:260px;
padding:20px;
}

.card{
background:white;
padding:15px;
margin-bottom:10px;
border-radius:8px;
}

input, select, textarea{
width:100%;
padding:8px;
margin:5px 0;
}

button.action{
background:#2563eb;
color:white;
border:none;
padding:10px;
margin:5px 0;
width:100%;
}

.tabs button{
width:auto;
margin-right:5px;
}

.active{
background:#16a34a !important;
}

</style>

</head>
<body>

<div class="sidebar">

<h2>Schumacher Automotive</h2>

<button onclick="nav('dashboard')">Dashboard</button>
<button onclick="nav('customers')">Customers</button>
<button onclick="nav('vehicles')">Vehicles</button>
<button onclick="nav('jobs')">Jobs</button>
<button onclick="nav('clock')">Clock Logs</button>

</div>

<div class="main" id="main"></div>

<script>

let db = JSON.parse(localStorage.getItem("dealerDB")) || {

customers:[],
vehicles:[],
jobs:[],
clockLogs:[],
parts:[],
labour:[]

};

function save(){

localStorage.setItem("dealerDB",JSON.stringify(db));
render();

}

function nav(screen){

window.screen=screen;
render();

}

function render(){

if(screen=="customers") renderCustomers();
else if(screen=="vehicles") renderVehicles();
else if(screen=="jobs") renderJobs();
else if(screen=="clock") renderClock();
else renderDashboard();

}

function renderDashboard(){

main.innerHTML=`

<h1>Dashboard</h1>

<div class="card">Customers: ${db.customers.length}</div>
<div class="card">Vehicles: ${db.vehicles.length}</div>
<div class="card">Open Jobs: ${db.jobs.filter(j=>j.status!="Completed").length}</div>
<div class="card">Completed Jobs: ${db.jobs.filter(j=>j.status=="Completed").length}</div>

`;

}

function renderCustomers(){

main.innerHTML=`

<h1>Customers</h1>

<input id="searchCust" placeholder="Search" oninput="listCustomers()">

<input id="custName" placeholder="Customer name">
<input id="custPhone" placeholder="Phone">

<button class="action" onclick="addCustomer()">Add Customer</button>

<div id="custList"></div>

`;

listCustomers();

}

function addCustomer(){

db.customers.push({

id:Date.now(),
name:custName.value,
phone:custPhone.value

});

save();

}

function listCustomers(){

let s=(searchCust.value||"").toLowerCase();

custList.innerHTML=db.customers
.filter(c=>c.name.toLowerCase().includes(s) || c.phone.includes(s))
.map(c=>`

<div class="card">

<b>${c.name}</b><br>
${c.phone}

</div>

`).join("");

}

function renderVehicles(){

main.innerHTML=`

<h1>Vehicles</h1>

<input id="reg" placeholder="Registration">
<input id="make" placeholder="Make">
<input id="model" placeholder="Model">

<select id="vehCust">

${db.customers.map(c=>`<option value="${c.id}">${c.name}</option>`)}

</select>

<button class="action" onclick="addVehicle()">Add Vehicle</button>

<div>

${db.vehicles.map(v=>{

let c=db.customers.find(c=>c.id==v.customerId);

return `<div class="card">${v.reg} ${v.make} ${v.model} (${c?.name})</div>`;

}).join("")}

</div>

`;

}

function addVehicle(){

db.vehicles.push({

id:Date.now(),
reg:reg.value,
make:make.value,
model:model.value,
customerId:vehCust.value

});

save();

}

function renderJobs(){

main.innerHTML=`

<h1>Jobs</h1>

<div class="tabs">

<button onclick="jobTab='Open';render()">Open</button>
<button onclick="jobTab='Completed';render()">Completed</button>

</div>

<select id="jobVeh">

${db.vehicles.map(v=>`<option value="${v.id}">${v.reg}</option>`)}

</select>

<button class="action" onclick="createJob()">Create Job</button>

<div>

${db.jobs
.filter(j=>!jobTab || j.status==jobTab)
.map(j=>{

let v=db.vehicles.find(v=>v.id==j.vehicleId);

return `

<div class="card">

<b>${v?.reg}</b><br>

Status: ${j.status}<br>

<button onclick="clockOn(${j.id})">Clock On</button>

<button onclick="clockOff(${j.id})">Clock Off</button>

<button onclick="addPart(${j.id})">Add Part</button>

<button onclick="addLabour(${j.id})">Add Labour</button>

<button onclick="completeJob(${j.id})">Complete</button>

</div>

`;

}).join("")}

</div>

`;

}

let jobTab="Open";

function createJob(){

db.jobs.push({

id:Date.now(),
vehicleId:jobVeh.value,
status:"Open",
clockStart:null

});

save();

}

function clockOn(id){

let job=db.jobs.find(j=>j.id==id);

job.clockStart=Date.now();

save();

}

function clockOff(id){

let job=db.jobs.find(j=>j.id==id);

if(job.clockStart){

let hours=(Date.now()-job.clockStart)/3600000;

db.labour.push({

jobId:id,
hours:hours

});

job.clockStart=null;

save();

}

}

function completeJob(id){

let job=db.jobs.find(j=>j.id==id);

job.status="Completed";

save();

}

function addPart(id){

let name=prompt("Part name");

let price=prompt("Price");

db.parts.push({

jobId:id,
name:name,
price:Number(price)

});

save();

}

function addLabour(id){

let hours=prompt("Hours");

db.labour.push({

jobId:id,
hours:Number(hours)

});

save();

}

function renderClock(){

main.innerHTML=`

<h1>Clock Logs</h1>

${db.labour.map(l=>`

<div class="card">

Job ${l.jobId} - ${l.hours.toFixed(2)} hrs

</div>

`).join("")}

`;

}

nav("dashboard");

</script>

</body>
</html>
