<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schumacher Automotive DMS</title>

<style>

body{
font-family:Arial;
background:#0b1220;
color:white;
margin:0;
}

.header{
background:#111827;
padding:15px;
font-size:22px;
font-weight:bold;
display:flex;
justify-content:space-between;
}

.tabs{
display:flex;
background:#1f2937;
}

.tab{
padding:12px;
cursor:pointer;
}

.tab.active{
background:#2563eb;
}

.search{
padding:10px;
background:#111827;
}

input{
padding:8px;
width:95%;
}

.job{
background:#1f2937;
margin:10px;
padding:15px;
border-radius:8px;
}

button{
background:#2563eb;
color:white;
border:none;
padding:8px;
margin:4px;
border-radius:6px;
}

.total{
color:#22c55e;
font-weight:bold;
}

.small{
color:#9ca3af;
font-size:12px;
}

</style>

</head>
<body>

<div class="header">
Schumacher Automotive DMS
<button onclick="newJob()">+ New Job</button>
</div>

<div class="tabs">
<div class="tab active" onclick="showTab('open')">Open Jobs</div>
<div class="tab" onclick="showTab('complete')">Completed</div>
</div>

<div class="search">
<input id="searchBox" placeholder="Search customer, reg, vehicle..." onkeyup="render()">
</div>

<div id="jobs"></div>

<script>

let jobs = JSON.parse(localStorage.getItem("jobs") || "[]")

let currentTab="open"

function save(){
localStorage.setItem("jobs",JSON.stringify(jobs))
render()
}

function showTab(tab){

currentTab=tab

document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"))

event.target.classList.add("active")

render()

}

function newJob(){

let customer = prompt("Customer name")
if(!customer) return

let vehicle = prompt("Vehicle")
let reg = prompt("Registration")

jobs.push({
id:Date.now(),
customer,
vehicle,
reg,
parts:[],
labour:0,
clockStart:null,
status:"open"
})

save()

}

function clockOn(id){

let job = jobs.find(j=>j.id==id)

job.clockStart=Date.now()

save()

}

function clockOff(id){

let job=jobs.find(j=>j.id==id)

if(job.clockStart){

let hours=(Date.now()-job.clockStart)/3600000

job.labour+=hours*120

job.clockStart=null

}

save()

}

function addPart(id){

let name=prompt("Part name")

let price=parseFloat(prompt("Price"))

if(!name || !price) return

let job=jobs.find(j=>j.id==id)

job.parts.push({name,price})

save()

}

function complete(id){

let job=jobs.find(j=>j.id==id)

job.status="complete"

save()

}

function total(job){

let parts=job.parts.reduce((a,b)=>a+b.price,0)

return parts+job.labour

}

function printJob(id){

let job=jobs.find(j=>j.id==id)

let w=window.open()

w.document.write("<h1>Schumacher Automotive</h1>")
w.document.write("Customer:"+job.customer+"<br>")
w.document.write("Vehicle:"+job.vehicle+"<br>")
w.document.write("Reg:"+job.reg+"<br>")

job.parts.forEach(p=>{
w.document.write(p.name+" $"+p.price+"<br>")
})

w.document.write("Labour:$"+job.labour.toFixed(2)+"<br>")
w.document.write("<h2>Total:$"+total(job).toFixed(2)+"</h2>")

w.print()

}

function render(){

let search=document.getElementById("searchBox").value.toLowerCase()

let html=""

jobs
.filter(job=>job.status==currentTab)
.filter(job=>
job.customer.toLowerCase().includes(search) ||
job.reg.toLowerCase().includes(search) ||
job.vehicle.toLowerCase().includes(search)
)
.reverse()
.forEach(job=>{

html+=`
<div class="job">

<b>${job.customer}</b><br>

${job.vehicle} - ${job.reg}

<div class="small">
${job.status}
</div>

<div class="total">
$${total(job).toFixed(2)}
</div>

<button onclick="clockOn(${job.id})">Clock On</button>

<button onclick="clockOff(${job.id})">Clock Off</button>

<button onclick="addPart(${job.id})">Add Part</button>

<button onclick="complete(${job.id})">Complete</button>

<button onclick="printJob(${job.id})">Print</button>

</div>
`

})

document.getElementById("jobs").innerHTML=html

}

render()

</script>

</body>
</html>
