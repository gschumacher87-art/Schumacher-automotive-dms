<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schumacher Workshop Management</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
body{background:#f4f6f9}
.hidden{display:none}

/* HEADER */
.header{
background:#0b1b3b;color:#fff;padding:15px 25px;
display:flex;justify-content:space-between;align-items:center
}
.header h1{font-size:18px}
.header button{
background:#fff;color:#0b1b3b;border:none;
padding:8px 14px;border-radius:6px;font-weight:bold;cursor:pointer
}

/* NAV */
.nav{
display:flex;background:#fff;border-bottom:1px solid #ddd
}
.nav button{
flex:1;padding:12px;border:none;background:#fff;
cursor:pointer;font-weight:600
}
.nav button.active{background:#e9edf5}

/* DASHBOARD */
.dashboard{
display:grid;grid-template-columns:repeat(4,1fr);
gap:20px;padding:20px
}
.card{
background:#fff;padding:20px;border-radius:10px;
box-shadow:0 2px 6px rgba(0,0,0,.05)
}
.card h3{font-size:12px;color:#777;margin-bottom:8px}
.card p{font-size:20px;font-weight:bold}

/* BOARD */
.board{
display:grid;grid-template-columns:repeat(4,1fr);
gap:15px;padding:20px
}
.column{
background:#e9edf5;border-radius:12px;padding:10px;
min-height:400px
}
.column h3{margin-bottom:10px;font-size:14px}
.job{
background:#fff;border-radius:8px;padding:10px;
margin-bottom:10px;cursor:grab;
box-shadow:0 2px 6px rgba(0,0,0,.1)
}
.status-booked{border-left:6px solid #3498db}
.status-progress{border-left:6px solid #f39c12}
.status-complete{border-left:6px solid #2ecc71}
.status-waiting{border-left:6px solid #e74c3c}

/* TABLE */
table{width:100%;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}

/* MODAL */
.modal{
position:fixed;inset:0;background:rgba(0,0,0,.5);
display:none;justify-content:center;align-items:center
}
.modal-content{
background:#fff;padding:20px;width:600px;
max-height:90vh;overflow:auto;border-radius:10px
}
.modal-content input,.modal-content select,.modal-content textarea{
width:100%;padding:6px;margin-bottom:8px
}
.modal-content button{
padding:6px 10px;border:none;border-radius:5px;margin-right:5px;cursor:pointer
}
.save{background:#0b1b3b;color:#fff}
.close{background:#ccc}
</style>
</head>
<body>

<div class="header">
<h1>Schumacher Workshop Management</h1>
<button onclick="openJob()">+ Job</button>
</div>

<div class="nav">
<button onclick="showTab('dashboard')" class="active">Dashboard</button>
<button onclick="showTab('board')">Workshop Board</button>
<button onclick="showTab('calendar')">Calendar</button>
<button onclick="showTab('customers')">Customers</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="dashboard">
<div class="card"><h3>Total Jobs</h3><p id="dJobs">0</p></div>
<div class="card"><h3>Revenue</h3><p id="dRevenue">$0</p></div>
<div class="card"><h3>Profit</h3><p id="dProfit">$0</p></div>
<div class="card"><h3>In Progress</h3><p id="dProgress">0</p></div>
</div>

<!-- BOARD -->
<div id="board" class="board hidden">
<div class="column" data-hoist="1"><h3>Hoist 1</h3></div>
<div class="column" data-hoist="2"><h3>Hoist 2</h3></div>
<div class="column" data-hoist="3"><h3>Hoist 3</h3></div>
<div class="column" data-hoist="4"><h3>Hoist 4</h3></div>
</div>

<!-- CALENDAR -->
<div id="calendar" class="hidden" style="padding:20px">
<div id="calendarGrid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:10px"></div>
</div>

<!-- CUSTOMERS -->
<div id="customers" class="hidden" style="padding:20px">
<table>
<thead><tr><th>Name</th><th>Phone</th><th>Vehicles</th></tr></thead>
<tbody id="customerTable"></tbody>
</table>
</div>

<!-- JOB MODAL -->
<div class="modal" id="jobModal">
<div class="modal-content">
<h3>Job File</h3>

<input id="customer" placeholder="Customer Name">
<input id="phone" placeholder="Phone">
<input id="vehicle" placeholder="Vehicle">
<input id="rego" placeholder="Registration">
<input type="date" id="bookingDate">

<select id="technician">
<option>Unassigned</option>
<option>Tech 1</option>
<option>Tech 2</option>
<option>Tech 3</option>
</select>

<select id="status">
<option value="booked">Booked</option>
<option value="progress">In Progress</option>
<option value="complete">Completed</option>
<option value="waiting">Waiting Parts</option>
</select>

<h4>Parts</h4>
<input type="number" id="partsCost" placeholder="Cost">
<input type="number" id="partsSell" placeholder="Sell">

<h4>Labour</h4>
<input type="number" id="hours" placeholder="Hours">
<input type="number" id="rate" placeholder="Rate">

<textarea id="notes" placeholder="Notes"></textarea>

<p id="total"></p>
<p id="profit"></p>

<button class="save" onclick="saveJob()">Save</button>
<button class="close" onclick="closeModal()">Close</button>

</div>
</div>

<script>
let jobs=JSON.parse(localStorage.getItem("fullSystem"))||[];
let editId=null;

/* NAV */
function showTab(id){
document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
event.target.classList.add("active");
document.querySelectorAll("#dashboard,#board,#calendar,#customers")
.forEach(t=>t.classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");
}

/* DASHBOARD */
function updateDashboard(){
dJobs.textContent=jobs.length;
dRevenue.textContent="$"+jobs.reduce((t,j)=>t+j.total,0).toFixed(2);
dProfit.textContent="$"+jobs.reduce((t,j)=>t+j.profit,0).toFixed(2);
dProgress.textContent=jobs.filter(j=>j.status==="progress").length;
}

/* BOARD */
function renderBoard(){
document.querySelectorAll(".column").forEach(c=>{
c.querySelectorAll(".job").forEach(j=>j.remove())
});
jobs.forEach(j=>{
let card=document.createElement("div");
card.className="job status-"+j.status;
card.draggable=true;
card.innerHTML=`<strong>${j.customer}</strong>
<small>${j.vehicle}</small>
<small>$${j.total.toFixed(2)}</small>`;
card.onclick=()=>editJob(j.id);
card.addEventListener("dragstart",e=>e.dataTransfer.setData("id",j.id));
document.querySelector(`[data-hoist="${j.hoist||1}"]`).appendChild(card);
});
updateDashboard();
}

/* DRAG */
document.querySelectorAll(".column").forEach(col=>{
col.addEventListener("dragover",e=>e.preventDefault());
col.addEventListener("drop",e=>{
let id=e.dataTransfer.getData("id");
let job=jobs.find(j=>j.id==id);
job.hoist=col.dataset.hoist;
save();
renderBoard();
});
});

/* CALENDAR */
function renderCalendar(){
calendarGrid.innerHTML="";
for(let i=1;i<=31;i++){
let day=document.createElement("div");
day.style.background="#fff";
day.style.padding="10px";
day.style.borderRadius="6px";
day.innerHTML="<strong>"+i+"</strong>";
jobs.filter(j=>new Date(j.bookingDate).getDate()==i)
.forEach(j=>{
let div=document.createElement("div");
div.textContent=j.customer;
div.style.fontSize="12px";
day.appendChild(div);
});
calendarGrid.appendChild(day);
}
}

/* CUSTOMERS */
function renderCustomers(){
let table="";
let unique=[...new Set(jobs.map(j=>j.customer))];
unique.forEach(name=>{
let cust=jobs.find(j=>j.customer===name);
let vehicles=jobs.filter(j=>j.customer===name).map(j=>j.vehicle).join(", ");
table+=`<tr><td>${name}</td><td>${cust.phone}</td><td>${vehicles}</td></tr>`;
});
customerTable.innerHTML=table;
}

/* MODAL */
function openJob(){editId=null;jobModal.style.display="flex"}
function closeModal(){jobModal.style.display="none"}

function calculate(){
let partsCost=+partsCost.value||0;
let partsSell=+partsSell.value||0;
let labour=(+hours.value||0)*(+rate.value||0);
let total=partsSell+labour;
let cost=partsCost+(+hours.value||0)*50;
let profitVal=total-cost;
total.innerText="Total: $"+total.toFixed(2);
profit.innerText="Profit: $"+profitVal.toFixed(2);
return{total,profit:profitVal};
}

document.querySelectorAll("#partsCost,#partsSell,#hours,#rate")
.forEach(i=>i.addEventListener("input",calculate));

function saveJob(){
let totals=calculate();
let data={
customer:customer.value,
phone:phone.value,
vehicle:vehicle.value,
rego:rego.value,
bookingDate:bookingDate.value,
technician:technician.value,
status:status.value,
partsCost:+partsCost.value||0,
partsSell:+partsSell.value||0,
hours:+hours.value||0,
rate:+rate.value||0,
notes:notes.value,
hoist:1,
...totals
};
if(editId){
Object.assign(jobs.find(j=>j.id===editId),data);
}else{
jobs.push({...data,id:Date.now()});
}
save();
renderAll();
closeModal();
}

function editJob(id){
let j=jobs.find(x=>x.id===id);
editId=id;
Object.keys(j).forEach(k=>{
if(document.getElementById(k))document.getElementById(k).value=j[k];
});
openJob();
}

function save(){localStorage.setItem("fullSystem",JSON.stringify(jobs))}
function renderAll(){renderBoard();renderCalendar();renderCustomers();updateDashboard()}

renderAll();
</script>

</body>
</html>
