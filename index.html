<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Day Bookings - Schumacher Automotive</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="main">

    <div id="dayPanel" class="day-panel" style="display:block;">

        <div class="day-header">
            <h2>
                <span id="dayTitle"></span>
                <span id="slotCounter" class="slots"></span>
            </h2>
            <button onclick="backToMonth()">← Back</button>
        </div>

        <button class="primary" onclick="addVehicle()">+ Add Vehicle</button>

        <table>
            <thead>
                <tr>
                    <th>Rego</th>
                    <th>Customer</th>
                    <th>Job Type</th>
                    <th>Status</th>
                    <th>Notes</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="jobTableBody"></tbody>
        </table>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
