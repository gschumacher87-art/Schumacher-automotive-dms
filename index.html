<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schumacher Automotive DMS</title>

<style>
body{
font-family:Arial;
background:#0b1220;
color:white;
margin:0;
}

.header{
background:#111827;
padding:15px;
font-size:22px;
font-weight:bold;
display:flex;
justify-content:space-between;
align-items:center;
}

button{
background:#2563eb;
color:white;
border:none;
padding:10px 15px;
margin:5px;
border-radius:6px;
}

.job{
background:#1f2937;
padding:15px;
margin:10px;
border-radius:8px;
}

input{
padding:8px;
margin:5px;
width:95%;
}

.total{
font-size:18px;
color:#22c55e;
font-weight:bold;
}

.small{
font-size:12px;
color:#9ca3af;
}
</style>
</head>

<body>

<div class="header">
Schumacher Automotive DMS
<button onclick="newJob()">+ New Job</button>
</div>

<div id="jobs"></div>

<script>

let jobs = JSON.parse(localStorage.getItem("jobs") || "[]")

function save(){
localStorage.setItem("jobs",JSON.stringify(jobs))
render()
}

function newJob(){

let customer = prompt("Customer name")
if(!customer) return

let vehicle = prompt("Vehicle")
let reg = prompt("Registration")

jobs.push({
id:Date.now(),
customer,
vehicle,
reg,
parts:[],
labour:0,
clockStart:null,
total:0,
status:"In Progress"
})

save()
}

function clockOn(id){
let job = jobs.find(j=>j.id==id)
job.clockStart = Date.now()
save()
}

function clockOff(id){
let job = jobs.find(j=>j.id==id)

if(job.clockStart){
let time = (Date.now()-job.clockStart)/3600000
job.labour += time * 120
job.clockStart = null
}

save()
}

function addPart(id){

let name = prompt("Part name")
let price = parseFloat(prompt("Price"))

if(!name || !price) return

let job = jobs.find(j=>j.id==id)
job.parts.push({name,price})

save()
}

function total(job){

let partsTotal = job.parts.reduce((a,b)=>a+b.price,0)
return partsTotal + job.labour

}

function complete(id){

let job = jobs.find(j=>j.id==id)
job.status="Complete"
save()

}

function printJob(id){

let job = jobs.find(j=>j.id==id)

let w=window.open()

w.document.write("<h1>Schumacher Automotive</h1>")
w.document.write("<h2>Invoice</h2>")
w.document.write("Customer: "+job.customer+"<br>")
w.document.write("Vehicle: "+job.vehicle+"<br>")
w.document.write("Reg: "+job.reg+"<br><br>")

w.document.write("<h3>Parts</h3>")
job.parts.forEach(p=>{
w.document.write(p.name+" $"+p.price+"<br>")
})

w.document.write("<h3>Labour: $"+job.labour.toFixed(2)+"</h3>")

w.document.write("<h2>Total: $"+total(job).toFixed(2)+"</h2>")

w.print()

}

function render(){

let html=""

jobs.reverse().forEach(job=>{

html+=`
<div class="job">

<b>${job.customer}</b><br>
${job.vehicle} - ${job.reg}<br>

<div class="small">
Status: ${job.status}
</div>

<div class="total">
$${total(job).toFixed(2)}
</div>

<button onclick="clockOn(${job.id})">Clock On</button>

<button onclick="clockOff(${job.id})">Clock Off</button>

<button onclick="addPart(${job.id})">Add Part</button>

<button onclick="complete(${job.id})">Complete</button>

<button onclick="printJob(${job.id})">Print</button>

</div>
`
})

document.getElementById("jobs").innerHTML=html

}

render()

</script>

</body>
</html>
