<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schumacher Automotive DMS</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f3f4f6;
}

.sidebar{
position:fixed;
width:240px;
height:100%;
background:#111827;
color:white;
padding:20px;
}

.sidebar h2{
margin-bottom:20px;
}

.sidebar button{
width:100%;
padding:12px;
margin-bottom:5px;
background:none;
border:none;
color:white;
text-align:left;
cursor:pointer;
}

.sidebar button:hover{
background:#1f2937;
}

.main{
margin-left:260px;
padding:20px;
}

.card{
background:white;
padding:15px;
margin-bottom:10px;
border-radius:8px;
cursor:pointer;
}

input, select{
width:100%;
padding:10px;
margin:5px 0;
}

button.action{
background:#2563eb;
color:white;
border:none;
padding:10px;
margin-top:5px;
width:100%;
cursor:pointer;
}

button.action:hover{
background:#1d4ed8;
}
</style>

</head>
<body>

<div class="sidebar">
<h2>Schumacher Automotive</h2>
<button onclick="navigate('dashboard')">Dashboard</button>
<button onclick="navigate('customers')">Customers</button>
<button onclick="navigate('parts')">Parts Database</button>
<button onclick="navigate('jobs')">All Jobs</button>
</div>

<div class="main" id="main"></div>

<script>

let screen = "dashboard";
let currentCustomer = null;
let currentJob = null;
let clockStart = null;

let db = JSON.parse(localStorage.getItem("dealerDB")) || {
customers:[],
jobs:[],
parts:[]
};

function save(){
localStorage.setItem("dealerDB",JSON.stringify(db));
render();
}

function navigate(s){
screen = s;
render();
}

function render(){

if(screen==="dashboard") renderDashboard();
if(screen==="customers") renderCustomers();
if(screen==="customerProfile") renderCustomerProfile();
if(screen==="parts") renderParts();
if(screen==="jobs") renderJobs();
if(screen==="jobEditor") renderJobEditor();

}

function renderDashboard(){

document.getElementById("main").innerHTML = `
<h1>Dashboard</h1>

<div class="card">Customers: ${db.customers.length}</div>
<div class="card">Jobs: ${db.jobs.length}</div>
<div class="card">Parts: ${db.parts.length}</div>
`;

}

function renderCustomers(){

document.getElementById("main").innerHTML = `
<h1>Customers</h1>

<input id="searchBox" placeholder="Search customers">

<input id="custName" placeholder="Customer name">
<input id="custPhone" placeholder="Phone">

<button class="action" onclick="addCustomer()">Add Customer</button>

<div id="customerList"></div>
`;

document.getElementById("searchBox").oninput = listCustomers;

listCustomers();

}

function listCustomers(){

let s = document.getElementById("searchBox").value.toLowerCase();

document.getElementById("customerList").innerHTML = db.customers
.filter(c =>
c.name.toLowerCase().includes(s) ||
c.phone.includes(s)
)
.map(c => `
<div class="card" onclick="openCustomer(${c.id})">
<b>${c.name}</b><br>
${c.phone}
</div>
`).join("");

}

function addCustomer(){

let name = document.getElementById("custName").value;
let phone = document.getElementById("custPhone").value;

if(!name) return;

db.customers.push({
id: Date.now(),
name,
phone
});

save();

}

function openCustomer(id){

currentCustomer = db.customers.find(c=>c.id===id);
screen = "customerProfile";
render();

}

function renderCustomerProfile(){

let jobs = db.jobs.filter(j=>j.customerId===currentCustomer.id);

document.getElementById("main").innerHTML = `
<h1>${currentCustomer.name}</h1>

<input id="editName" value="${currentCustomer.name}">
<input id="editPhone" value="${currentCustomer.phone}">

<button class="action" onclick="saveCustomer()">Save Customer</button>

<h2>Jobs</h2>

<button class="action" onclick="createJob()">New Job</button>

${jobs.map(j=>`
<div class="card" onclick="openJob(${j.id})">
Job ${j.id}<br>
Status: ${j.status}<br>
Parts: ${j.parts.length}
</div>
`).join("")}
`;

}

function saveCustomer(){

currentCustomer.name = document.getElementById("editName").value;
currentCustomer.phone = document.getElementById("editPhone").value;

save();

}

function createJob(){

let job = {
id: Date.now(),
customerId: currentCustomer.id,
status: "Open",
parts: [],
labour: 0
};

db.jobs.push(job);

currentJob = job;
screen = "jobEditor";
render();

}

function openJob(id){

currentJob = db.jobs.find(j=>j.id===id);
screen = "jobEditor";
render();

}

function renderJobEditor(){

document.getElementById("main").innerHTML = `
<h1>Job ${currentJob.id}</h1>

Status: ${currentJob.status}<br>
Labour: ${currentJob.labour.toFixed(2)} hrs<br>

<button class="action" onclick="clockOn()">Clock On</button>
<button class="action" onclick="clockOff()">Clock Off</button>

<h3>Add Part</h3>

<select id="partSelect">
${db.parts.map(p=>`<option value="${p.id}">${p.name} ($${p.price})</option>`).join("")}
</select>

<button class="action" onclick="addPartToJob()">Add Part</button>

<h3>Parts</h3>

${currentJob.parts.map(p=>`
<div class="card">${p.name} - $${p.price}</div>
`).join("")}

<button class="action" onclick="completeJob()">Complete Job</button>

<button class="action" onclick="openCustomer(${currentJob.customerId})">Back to Customer</button>
`;

}

function clockOn(){
clockStart = Date.now();
}

function clockOff(){

if(clockStart){
let hours = (Date.now()-clockStart)/3600000;
currentJob.labour += hours;
clockStart = null;
save();
}

}

function completeJob(){
currentJob.status = "Completed";
save();
}

function renderParts(){

document.getElementById("main").innerHTML = `
<h1>Parts Database</h1>

<input id="partName" placeholder="Part name">
<input id="partPrice" placeholder="Price">

<button class="action" onclick="addPart()">Add Part</button>

${db.parts.map(p=>`
<div class="card">${p.name} - $${p.price}</div>
`).join("")}
`;

}

function addPart(){

let name = document.getElementById("partName").value;
let price = Number(document.getElementById("partPrice").value);

if(!name) return;

db.parts.push({
id: Date.now(),
name,
price
});

save();

}

function addPartToJob(){

let id = Number(document.getElementById("partSelect").value);
let part = db.parts.find(p=>p.id===id);

currentJob.parts.push(part);

save();

}

function renderJobs(){

document.getElementById("main").innerHTML = `
<h1>All Jobs</h1>

${db.jobs.map(j=>{
let cust = db.customers.find(c=>c.id===j.customerId);
return `
<div class="card" onclick="openJob(${j.id})">
${cust?.name}<br>
Job ${j.id}<br>
Status: ${j.status}
</div>
`;
}).join("")}
`;

}

render();

</script>

</body>
</html>
