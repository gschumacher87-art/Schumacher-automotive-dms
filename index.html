<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schumacher Automotive Workshop</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f4f6f8;
}

.header{
background:#2c3e50;
color:white;
padding:20px;
font-size:22px;
}

.container{
padding:20px;
}

.card{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:8px;
}

input, button{
width:100%;
padding:12px;
margin-top:10px;
border-radius:6px;
border:1px solid #ccc;
font-size:16px;
}

button{
background:#2c3e50;
color:white;
border:none;
}

button:hover{
background:#34495e;
}

.customer{
padding:15px;
background:#e9ecef;
margin-top:8px;
border-radius:8px;
cursor:pointer;
}

.job{
padding:10px;
background:#f1f1f1;
margin-top:5px;
border-radius:6px;
}

.backBtn{
background:#777;
margin-top:15px;
}

</style>
</head>

<body>

<div class="header">
Schumacher Automotive Workshop
</div>

<div class="container">

<div class="card">

<h3>Add Customer</h3>

<input id="customerName" placeholder="Customer Name">
<input id="customerPhone" placeholder="Phone">

<button onclick="addCustomer()">Add Customer</button>

</div>


<div class="card">

<h3>Customers</h3>

<div id="customerList"></div>

<div id="customerProfile" style="display:none;">

<h3 id="profileName"></h3>

<input id="jobInput" placeholder="Job Description">

<button onclick="addJob()">Add Job</button>

<h4>Job History</h4>

<div id="jobHistory"></div>

<button class="backBtn" onclick="closeProfile()">
Back to Customers
</button>

</div>

</div>

</div>


<script>

let customers =
JSON.parse(localStorage.getItem("customers")) || [];

let activeCustomer = null;


function save(){

localStorage.setItem("customers",
JSON.stringify(customers));

}


function addCustomer(){

let name =
document.getElementById("customerName").value;

let phone =
document.getElementById("customerPhone").value;

if(!name) return;

customers.push({

name:name,
phone:phone,
jobs:[]

});

save();

document.getElementById("customerName").value="";
document.getElementById("customerPhone").value="";

renderCustomers();

}


function renderCustomers(){

let list =
document.getElementById("customerList");

list.innerHTML="";

customers.forEach((customer,index)=>{

list.innerHTML +=
`
<div class="customer"
onclick="openCustomer(${index})">

${customer.name} - ${customer.phone}

</div>
`;

});

}


function openCustomer(index){

activeCustomer=index;

document.getElementById("customerList").style.display="none";

document.getElementById("customerProfile").style.display="block";

document.getElementById("profileName").innerText =
customers[index].name;

renderJobs();

}


function closeProfile(){

document.getElementById("customerProfile").style.display="none";

document.getElementById("customerList").style.display="block";

}


function addJob(){

let text =
document.getElementById("jobInput").value;

if(!text) return;

customers[activeCustomer].jobs.push({

description:text,
date:new Date().toLocaleDateString()

});

save();

document.getElementById("jobInput").value="";

renderJobs();

}


function renderJobs(){

let history =
document.getElementById("jobHistory");

history.innerHTML="";

customers[activeCustomer].jobs.forEach(job=>{

history.innerHTML +=
`
<div class="job">

${job.date} — ${job.description}

</div>
`;

});

}


renderCustomers();

</script>

</body>
</html>
