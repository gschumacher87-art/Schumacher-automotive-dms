<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schumacher Automotive Workshop</title>

<style>
body {
font-family: Arial;
margin: 0;
background: #f4f6f8;
}

.header {
background: #1f3a5f;
color: white;
padding: 15px;
font-size: 22px;
}

.container {
padding: 15px;
}

.card {
background: white;
padding: 15px;
margin-bottom: 15px;
border-radius: 8px;
box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

button {
background: #1f3a5f;
color: white;
border: none;
padding: 10px;
width: 100%;
margin-top: 5px;
border-radius: 5px;
}

input {
width: 100%;
padding: 10px;
margin-top: 5px;
}

.customer {
padding: 10px;
background: #e9eef5;
margin-top: 5px;
border-radius: 5px;
cursor: pointer;
}
</style>

</head>
<body>

<div class="header">
Schumacher Automotive Workshop
</div>

<div class="container">

<div class="card">
<h3>Add Customer</h3>

<input id="customerName" placeholder="Customer Name">
<input id="customerPhone" placeholder="Phone">

<button onclick="addCustomer()">Add Customer</button>

<h3>Customers</h3>
<div id="customerList"></div>

</div>

<div id="customerProfile" class="card" style="display:none;">
<h3 id="profileName"></h3>

<h4>Add Vehicle</h4>

<input id="rego" placeholder="Rego">
<input id="make" placeholder="Make">
<input id="model" placeholder="Model">

<button onclick="addVehicle()">Add Vehicle</button>

<h4>Vehicles</h4>
<div id="vehicleList"></div>

</div>

</div>

<script>

let customers = JSON.parse(localStorage.getItem("customers")) || [];
let selectedCustomer = null;

function save(){
localStorage.setItem("customers", JSON.stringify(customers));
}

function addCustomer(){

let name = document.getElementById("customerName").value;
let phone = document.getElementById("customerPhone").value;

if(!name) return;

customers.push({
name,
phone,
vehicles:[]
});

save();
renderCustomers();

}

function renderCustomers(){

let list = document.getElementById("customerList");
list.innerHTML = "";

customers.forEach((c,index)=>{

let div = document.createElement("div");

div.className="customer";

div.innerHTML = c.name + " - " + c.phone;

div.onclick = ()=>openCustomer(index);

list.appendChild(div);

});

}

function openCustomer(index){

selectedCustomer = index;

let c = customers[index];

document.getElementById("customerProfile").style.display="block";

document.getElementById("profileName").innerHTML = c.name;

renderVehicles();

}

function addVehicle(){

let rego = document.getElementById("rego").value;
let make = document.getElementById("make").value;
let model = document.getElementById("model").value;

customers[selectedCustomer].vehicles.push({
rego,
make,
model
});

save();
renderVehicles();

}

function renderVehicles(){

let list = document.getElementById("vehicleList");

list.innerHTML="";

customers[selectedCustomer].vehicles.forEach(v=>{

let div = document.createElement("div");

div.className="customer";

div.innerHTML =
v.rego + " - " +
v.make + " " +
v.model;

list.appendChild(div);

});

}

renderCustomers();

</script>

</body>
</html>
