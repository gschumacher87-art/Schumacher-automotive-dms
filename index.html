<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schumacher Automotive DMS</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f4f6f8;
}

.sidebar{
position:fixed;
width:220px;
height:100%;
background:#1f2937;
color:white;
padding-top:20px;
}

.sidebar h2{
text-align:center;
margin-bottom:30px;
}

.sidebar button{
width:100%;
padding:15px;
border:none;
background:none;
color:white;
text-align:left;
font-size:16px;
}

.sidebar button:hover{
background:#374151;
}

.main{
margin-left:220px;
padding:20px;
}

.header{
background:white;
padding:15px;
border-radius:8px;
margin-bottom:20px;
font-size:22px;
font-weight:bold;
}

.card{
background:white;
padding:15px;
margin-bottom:15px;
border-radius:8px;
}

input, textarea, select{
width:100%;
padding:10px;
margin:5px 0;
border-radius:6px;
border:1px solid #ccc;
}

button.action{
background:#2563eb;
color:white;
border:none;
padding:10px;
margin-top:10px;
border-radius:6px;
}

button.delete{
background:#dc2626;
}

.job{
border:1px solid #ddd;
padding:10px;
margin-top:10px;
border-radius:6px;
}

</style>

</head>
<body>

<div class="sidebar">

<h2>DMS</h2>

<button onclick="showPage('dashboard')">Dashboard</button>
<button onclick="showPage('customers')">Customers</button>
<button onclick="showPage('jobs')">Jobs</button>

</div>

<div class="main">

<div class="header" id="title">Dashboard</div>

<div id="content"></div>

</div>

<script>

let customers = JSON.parse(localStorage.getItem("customers") || "[]");
let jobs = JSON.parse(localStorage.getItem("jobs") || "[]");

function save(){
localStorage.setItem("customers",JSON.stringify(customers));
localStorage.setItem("jobs",JSON.stringify(jobs));
}

function showPage(page){

document.getElementById("title").innerText = page.charAt(0).toUpperCase()+page.slice(1);

if(page=="dashboard") dashboard();
if(page=="customers") customersPage();
if(page=="jobs") jobsPage();

}

function dashboard(){

let html = `
<div class="card">
Total Customers: ${customers.length}
</div>

<div class="card">
Total Jobs: ${jobs.length}
</div>
`;

document.getElementById("content").innerHTML = html;

}

function customersPage(){

let html = `
<div class="card">

<h3>Add Customer</h3>

<input id="cname" placeholder="Customer Name">
<input id="cphone" placeholder="Phone">
<input id="cvehicle" placeholder="Vehicle">

<button class="action" onclick="addCustomer()">Add Customer</button>

</div>

<div class="card">

<h3>Customer List</h3>

`;

customers.forEach((c,i)=>{

html+=`
<div class="job">

<b>${c.name}</b><br>
${c.phone}<br>
${c.vehicle}

<button class="action" onclick="deleteCustomer(${i})">Delete</button>

</div>
`;

});

html+=`</div>`;

document.getElementById("content").innerHTML = html;

}

function addCustomer(){

let name=document.getElementById("cname").value;
let phone=document.getElementById("cphone").value;
let vehicle=document.getElementById("cvehicle").value;

customers.push({
name,phone,vehicle
});

save();
customersPage();

}

function deleteCustomer(i){

customers.splice(i,1);

save();
customersPage();

}

function jobsPage(){

let html = `
<div class="card">

<h3>Create Job</h3>

<select id="jobCustomer">
${customers.map((c,i)=>`<option value="${i}">${c.name}</option>`).join("")}
</select>

<input id="jobDesc" placeholder="Job Description">

<select id="jobStatus">
<option>Pending</option>
<option>In Progress</option>
<option>Completed</option>
</select>

<button class="action" onclick="addJob()">Create Job</button>

</div>

<div class="card">

<h3>Job List</h3>

`;

jobs.forEach((j,i)=>{

html+=`
<div class="job">

<b>${customers[j.customer]?.name || "Unknown"}</b><br>

${j.desc}<br>

Status: ${j.status}

<br>

<select onchange="updateStatus(${i},this.value)">
<option ${j.status=="Pending"?"selected":""}>Pending</option>
<option ${j.status=="In Progress"?"selected":""}>In Progress</option>
<option ${j.status=="Completed"?"selected":""}>Completed</option>
</select>

<button class="delete" onclick="deleteJob(${i})">Delete</button>

</div>
`;

});

html+=`</div>`;

document.getElementById("content").innerHTML = html;

}

function addJob(){

let customer=document.getElementById("jobCustomer").value;
let desc=document.getElementById("jobDesc").value;
let status=document.getElementById("jobStatus").value;

jobs.push({
customer,desc,status
});

save();
jobsPage();

}

function updateStatus(i,status){

jobs[i].status=status;

save();

}

function deleteJob(i){

jobs.splice(i,1);

save();
jobsPage();

}

dashboard();

</script>

</body>
</html>
