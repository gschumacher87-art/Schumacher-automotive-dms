<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schumacher Automotive Workshop System</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,sans-serif; }

body { display:flex; background:#f4f6f9; height:100vh; }

.sidebar {
    width:250px;
    background:#0b1b3b;
    color:white;
    padding:20px;
}

.sidebar h2 { margin-bottom:30px; }

.sidebar button {
    width:100%;
    padding:12px;
    margin-bottom:10px;
    background:none;
    border:none;
    color:#cfd6e6;
    text-align:left;
    cursor:pointer;
    font-size:15px;
}

.sidebar button:hover { color:white; }

.main {
    flex:1;
    padding:30px;
    overflow:auto;
}

.hidden { display:none; }

.cards { display:flex; gap:20px; margin-bottom:30px; }

.card {
    background:white;
    padding:20px;
    border-radius:10px;
    flex:1;
    box-shadow:0 2px 6px rgba(0,0,0,0.05);
}

.card h3 { font-size:14px; color:#888; margin-bottom:10px; }
.card p { font-size:26px; font-weight:bold; }

.calendar {
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    gap:10px;
}

.day {
    background:white;
    padding:15px;
    border-radius:8px;
    min-height:100px;
    cursor:pointer;
    box-shadow:0 1px 4px rgba(0,0,0,0.05);
}

.day:hover { background:#eef2ff; }

.job-item {
    background:#0b1b3b;
    color:white;
    padding:4px;
    margin-top:5px;
    border-radius:4px;
    font-size:12px;
}

input, select {
    width:100%;
    padding:8px;
    margin-bottom:10px;
}

button.action {
    padding:10px 15px;
    background:#0b1b3b;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.job-card {
    background:white;
    padding:15px;
    margin-bottom:10px;
    border-radius:8px;
}

.job-card small { color:#666; }

</style>
</head>

<body>

<div class="sidebar">
    <h2>Schumacher Automotive</h2>
    <button onclick="showTab('dashboard')">Dashboard</button>
    <button onclick="showTab('calendar')">Calendar</button>
    <button onclick="showTab('jobs')">Jobs</button>
</div>

<div class="main">

    <!-- DASHBOARD -->
    <div id="dashboardTab">
        <h1>Dashboard</h1>
        <div class="cards">
            <div class="card">
                <h3>Total Jobs</h3>
                <p id="totalJobs">0</p>
            </div>
            <div class="card">
                <h3>Vehicles In Progress</h3>
                <p id="inProgress">0</p>
            </div>
            <div class="card">
                <h3>Completed Jobs</h3>
                <p id="completedJobs">0</p>
            </div>
        </div>
    </div>

    <!-- CALENDAR -->
    <div id="calendarTab" class="hidden">
        <h1>Workshop Calendar</h1>
        <div class="calendar" id="calendar"></div>
    </div>

    <!-- JOBS -->
    <div id="jobsTab" class="hidden">
        <h1>Create Job</h1>

        <input type="text" id="customerName" placeholder="Customer Name">
        <input type="text" id="vehicle" placeholder="Vehicle">
        <input type="text" id="rego" placeholder="Registration">
        <input type="text" id="parts" placeholder="Parts Used">
        <input type="number" id="labour" placeholder="Labour Hours">
        <select id="status">
            <option>Booked</option>
            <option>In Progress</option>
            <option>Completed</option>
        </select>
        <button class="action" onclick="addJob()">Add Job</button>

        <h2 style="margin-top:30px;">All Jobs</h2>
        <div id="jobList"></div>
    </div>

</div>

<script>

let jobs = JSON.parse(localStorage.getItem("jobs")) || [];

function saveJobs(){
    localStorage.setItem("jobs", JSON.stringify(jobs));
    renderJobs();
    updateDashboard();
    renderCalendar();
}

function showTab(tab){
    document.getElementById("dashboardTab").classList.add("hidden");
    document.getElementById("calendarTab").classList.add("hidden");
    document.getElementById("jobsTab").classList.add("hidden");

    document.getElementById(tab+"Tab").classList.remove("hidden");
}

function addJob(){
    const job = {
        id: Date.now(),
        customer: customerName.value,
        vehicle: vehicle.value,
        rego: rego.value,
        parts: parts.value,
        labour: labour.value,
        status: status.value,
        date: new Date().getDate()
    };

    jobs.push(job);
    saveJobs();

    document.querySelectorAll("input").forEach(i=>i.value="");
}

function renderJobs(){
    const list = document.getElementById("jobList");
    list.innerHTML = "";

    jobs.forEach(job=>{
        list.innerHTML += `
        <div class="job-card">
            <strong>${job.customer}</strong> - ${job.vehicle} (${job.rego})<br>
            <small>Parts: ${job.parts} | Labour: ${job.labour} hrs</small><br>
            <small>Status: ${job.status}</small>
        </div>`;
    });
}

function updateDashboard(){
    totalJobs.textContent = jobs.length;
    inProgress.textContent = jobs.filter(j=>j.status==="In Progress").length;
    completedJobs.textContent = jobs.filter(j=>j.status==="Completed").length;
}

function renderCalendar(){
    const cal = document.getElementById("calendar");
    cal.innerHTML = "";
    for(let i=1;i<=31;i++){
        const dayDiv = document.createElement("div");
        dayDiv.className="day";
        dayDiv.innerHTML = "<strong>"+i+"</strong>";

        jobs.filter(j=>j.date===i).forEach(job=>{
            const item=document.createElement("div");
            item.className="job-item";
            item.textContent=job.customer;
            dayDiv.appendChild(item);
        });

        cal.appendChild(dayDiv);
    }
}

renderJobs();
updateDashboard();
renderCalendar();

</script>

</body>
</html>
