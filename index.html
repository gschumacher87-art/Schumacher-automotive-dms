<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schumacher Automotive DMS</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{display:flex;background:#f4f6f9;}

.sidebar{
    width:220px;
    background:#0c1b33;
    color:white;
    min-height:100vh;
    padding:20px;
}
.sidebar h2{margin-bottom:30px;font-size:18px;}
.sidebar ul{list-style:none;}
.sidebar li{margin:18px 0;cursor:pointer;}

.main{flex:1;padding:30px;}

.cards{display:flex;gap:20px;margin-bottom:30px;}
.card{
    background:white;
    padding:20px;
    border-radius:10px;
    flex:1;
    box-shadow:0 2px 8px rgba(0,0,0,0.05);
    cursor:pointer;
}

button{cursor:pointer;border:none;padding:8px 14px;border-radius:8px;}
.primary{background:#3b82f6;color:white;}
.danger{background:#ff4d4d;color:white;}

table{width:100%;border-collapse:collapse;margin-top:15px;}
th,td{padding:10px;border:1px solid #ddd;text-align:left;}
th{background:#f1f1f1;}

.calendar-wrapper{display:none;background:white;padding:20px;border-radius:12px;}
.month-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.month-box{background:#f8f9fa;padding:15px;border-radius:10px;cursor:pointer;}
.day-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-top:20px;}
.day-box{padding:15px;background:#f1f1f1;border-radius:8px;text-align:center;cursor:pointer;position:relative;}
.day-count{position:absolute;top:5px;right:6px;background:#3b82f6;color:white;font-size:11px;padding:2px 6px;border-radius:12px;}
.day-full{background:#ff4d4d;color:white;}
.day-panel{display:none;margin-top:20px;}
</style>
</head>

<body>

<div class="sidebar">
    <h2>Schumacher Automotive</h2>
    <ul>
        <li onclick="openDashboard()">Dashboard</li>
        <li onclick="openCustomers()">Customers</li>
        <li onclick="openJobs()">Jobs</li>
        <li onclick="openCalendar()">Calendar</li>
    </ul>
</div>

<div class="main">

<!-- DASHBOARD -->
<div id="dashboardSection">
    <h1>Dashboard</h1>
    <div class="cards">
        <div class="card">
            <h3>Bookings Today</h3>
            <p id="bookingCount">0</p>
        </div>
    </div>
</div>

<!-- CUSTOMERS -->
<div id="customersSection" style="display:none;">
    <h1>Customers</h1>
    <button class="primary" onclick="addCustomer()">+ Add Customer</button>
    <table>
        <thead>
            <tr><th>Name</th><th>Phone</th><th>Email</th><th></th></tr>
        </thead>
        <tbody id="customerTableBody"></tbody>
    </table>
</div>

<!-- JOB TYPES DATABASE -->
<div id="jobsSection" style="display:none;">
    <h1>Job Types</h1>
    <button class="primary" onclick="addJobType()">+ Add Job Type</button>

    <table>
        <thead>
            <tr>
                <th>Job Name</th>
                <th>Estimated Hours</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="jobTypeTable"></tbody>
    </table>
</div>

<!-- CALENDAR -->
<div id="calendarWrapper" class="calendar-wrapper">
    <h2>
        Bookings -
        <button onclick="changeYear(-1)">&lt;&lt;</button>
        <span id="yearDisplay"></span>
        <button onclick="changeYear(1)">&gt;&gt;</button>
    </h2>

    <div id="calendarGrid" class="month-grid"></div>
    <div id="monthView"></div>

    <div id="dayPanel" class="day-panel">
        <h2 id="dayTitle"></h2>
        <button onclick="backToMonth()">← Back</button>
        <button class="primary" onclick="addVehicle()">+ Add Booking</button>

        <table>
            <thead>
                <tr>
                    <th>Rego</th>
                    <th>Customer</th>
                    <th>Job Type</th>
                    <th>Status</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="jobTableBody"></tbody>
        </table>
    </div>
</div>

</div>

<script>

/* =====================
   STORAGE
===================== */

let customers = JSON.parse(localStorage.getItem("workshopCustomers")) || [];
let jobTypes = JSON.parse(localStorage.getItem("workshopJobTypes")) || [];
let jobs = JSON.parse(localStorage.getItem("workshopJobs")) || {};

function saveAll(){
    localStorage.setItem("workshopCustomers", JSON.stringify(customers));
    localStorage.setItem("workshopJobTypes", JSON.stringify(jobTypes));
    localStorage.setItem("workshopJobs", JSON.stringify(jobs));
}

/* =====================
   SECTION SWITCHING
===================== */

function hideAll(){
    document.getElementById("dashboardSection").style.display="none";
    document.getElementById("customersSection").style.display="none";
    document.getElementById("jobsSection").style.display="none";
    document.getElementById("calendarWrapper").style.display="none";
}

function openDashboard(){hideAll();document.getElementById("dashboardSection").style.display="block";}
function openCustomers(){hideAll();document.getElementById("customersSection").style.display="block";renderCustomers();}
function openJobs(){hideAll();document.getElementById("jobsSection").style.display="block";renderJobTypes();}
function openCalendar(){hideAll();document.getElementById("calendarWrapper").style.display="block";}

/* =====================
   CUSTOMERS
===================== */

function addCustomer(){
    const name=prompt("Customer Name:");
    if(!name) return;
    const phone=prompt("Phone:");
    const email=prompt("Email:");
    customers.push({name,phone,email});
    saveAll();
    renderCustomers();
}

function renderCustomers(){
    const table=document.getElementById("customerTableBody");
    table.innerHTML="";
    customers.forEach((c,i)=>{
        table.innerHTML+=`
            <tr>
                <td>${c.name}</td>
                <td>${c.phone||""}</td>
                <td>${c.email||""}</td>
                <td><button onclick="deleteCustomer(${i})">✕</button></td>
            </tr>`;
    });
}

function deleteCustomer(i){customers.splice(i,1);saveAll();renderCustomers();}

/* =====================
   JOB TYPES DATABASE
===================== */

function addJobType(){
    const name=prompt("Job Name (e.g. Service, Brakes):");
    if(!name) return;
    const hours=prompt("Estimated Hours:");
    jobTypes.push({name,hours});
    saveAll();
    renderJobTypes();
}

function renderJobTypes(){
    const table=document.getElementById("jobTypeTable");
    table.innerHTML="";
    jobTypes.forEach((j,i)=>{
        table.innerHTML+=`
            <tr>
                <td>${j.name}</td>
                <td>${j.hours||""}</td>
                <td><button onclick="deleteJobType(${i})">✕</button></td>
            </tr>`;
    });
}

function deleteJobType(i){jobTypes.splice(i,1);saveAll();renderJobTypes();}

/* =====================
   CALENDAR
===================== */

let currentYear=new Date().getFullYear();
let selectedDateKey=null;

function changeYear(dir){currentYear+=dir;buildCalendar();}

function buildCalendar(){
    document.getElementById("yearDisplay").innerText=currentYear;
    const grid=document.getElementById("calendarGrid");
    grid.innerHTML="";
    const months=["January","February","March","April","May","June","July","August","September","October","November","December"];
    months.forEach((m,i)=>{
        grid.innerHTML+=`<div class="month-box" onclick="showMonth(${i})">${m}</div>`;
    });
}

function showMonth(monthIndex){
    const days=new Date(currentYear,monthIndex+1,0).getDate();
    const view=document.getElementById("monthView");
    view.innerHTML="";
    for(let d=1;d<=days;d++){
        view.innerHTML+=`<div class="day-box" onclick="openDay(${monthIndex},${d})">${d}</div>`;
    }
}

function openDay(monthIndex,day){
    selectedDateKey=`${currentYear}-${monthIndex}-${day}`;
    if(!jobs[selectedDateKey]) jobs[selectedDateKey]=[];
    document.getElementById("dayPanel").style.display="block";
    document.getElementById("dayTitle").innerText=`${day}/${monthIndex+1}/${currentYear}`;
    renderBookings();
}

function addVehicle(){
    const rego=prompt("Rego:");
    const customer=prompt("Customer:");

    if(jobTypes.length===0){
        alert("Add Job Types first in Jobs section.");
        return;
    }

    let list="Select Job:\n";
    jobTypes.forEach((j,i)=>{list+=`${i+1}. ${j.name}\n`;});
    const choice=prompt(list);
    const jobType=jobTypes[choice-1]?.name || "";

    const status=prompt("Status:");

    jobs[selectedDateKey].push({rego,customer,jobType,status});
    saveAll();
    renderBookings();
}

function renderBookings(){
    const table=document.getElementById("jobTableBody");
    table.innerHTML="";
    jobs[selectedDateKey].forEach((j,i)=>{
        table.innerHTML+=`
            <tr>
                <td>${j.rego}</td>
                <td>${j.customer}</td>
                <td>${j.jobType}</td>
                <td>${j.status||""}</td>
                <td><button onclick="deleteBooking(${i})">✕</button></td>
            </tr>`;
    });
}

function deleteBooking(i){
    jobs[selectedDateKey].splice(i,1);
    saveAll();
    renderBookings();
}

buildCalendar();
openDashboard();

</script>
</body>
</html>
